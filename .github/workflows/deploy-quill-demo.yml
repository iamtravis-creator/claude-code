name: Deploy quill-delta demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/quill-delta-demo/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/quill-delta-demo/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: examples/quill-delta-demo

      - name: Build
        run: npm run build
        working-directory: examples/quill-delta-demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/quill-delta-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
