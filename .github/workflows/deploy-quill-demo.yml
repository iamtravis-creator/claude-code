name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/quill-delta-demo/**'
      - 'main10/coming-soon.html'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/quill-delta-demo/package-lock.json

      - name: Build quill-delta demo
        run: npm install && npm run build
        working-directory: examples/quill-delta-demo

      - name: Assemble site
        run: |
          mkdir -p _site/quill-delta-demo
          mkdir -p _site/main10
          cp -r examples/quill-delta-demo/dist/. _site/quill-delta-demo/
          cp main10/coming-soon.html _site/main10/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
