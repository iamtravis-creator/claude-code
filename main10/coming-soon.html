<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main10 — Coming Soon</title>
  <meta name="description" content="Melbourne's bond-back cleaning specialists. Something big is coming." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0d1f35;
      --navy2:  #132843;
      --amber:  #f0a500;
      --amber2: #ffbe3d;
      --white:  #f0f4f9;
      --muted:  #7a93b3;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--navy);
      color: var(--white);
      overflow: hidden;
    }

    /* ── Animated background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(240,165,0,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 20%, rgba(19,40,67,0.9) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Grid ── */
    .page {
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      position: relative;
    }

    .card {
      text-align: center;
      max-width: 560px;
      animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* ── Logo mark ── */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
    }
    .logo-mark {
      width: 44px;
      height: 44px;
      background: var(--amber);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--navy);
      letter-spacing: -0.5px;
    }
    .logo-name {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--white);
    }

    /* ── Headline ── */
    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 1.25rem;
    }
    h1 span {
      color: var(--amber);
    }

    .sub {
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    /* ── Email form ── */
    .form {
      display: flex;
      gap: 0.5rem;
      max-width: 400px;
      margin: 0 auto 2rem;
    }
    .form input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--navy2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--white);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form input::placeholder { color: var(--muted); }
    .form input:focus { border-color: var(--amber); }
    .form button {
      padding: 0.75rem 1.25rem;
      background: var(--amber);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }
    .form button:hover { background: var(--amber2); }
    .form button:active { transform: scale(0.97); }

    /* ── Confirm message ── */
    .confirm {
      display: none;
      color: var(--amber);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      animation: fadeUp 0.4s ease both;
    }

    /* ── Badges ── */
    .badges {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .badge {
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(240,165,0,0.3);
      border-radius: 100px;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* ── Corner tag ── */
    .corner {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: rgba(122,147,179,0.5);
      white-space: nowrap;
    }

    /* ── Pulse dot ── */
    .pulse-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #4caf7d;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="logo">
        <div class="logo-mark">M10</div>
        <span class="logo-name">Main10</span>
      </div>

      <div class="pulse-wrap">
        <div class="dot"></div>
        Launching soon in Melbourne
      </div>

      <h1>Your bond back,<br><span>guaranteed.</span></h1>

      <p class="sub">
        End-of-lease cleaning done right the first time.<br>
        Fixed prices. 7-day re-clean promise. Zero stress.
      </p>

      <form class="form" onsubmit="handleSubmit(event)">
        <input type="email" placeholder="your@email.com" required />
        <button type="submit">Notify me</button>
      </form>

      <p class="confirm" id="confirm">✓ You're on the list — we'll be in touch!</p>

      <div class="badges">
        <span class="badge">Bond-back guarantee</span>
        <span class="badge">Fixed pricing</span>
        <span class="badge">Melbourne-wide</span>
      </div>

    </div>
  </div>

  <p class="corner">main10.com.au &nbsp;·&nbsp; Melbourne, VIC</p>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      e.target.style.display = 'none';
      document.getElementById('confirm').style.display = 'block';
    }
  </script>
</body>
</html>
